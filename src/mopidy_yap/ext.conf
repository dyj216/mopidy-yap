[yap]
enabled = true
votes_to_skip = 3
votes_to_delete = 3
# Number of votes needed to make track played after current one
votes_to_top = 3
pause_button = false
# When the last track in the queue starts playing, add a recommended track so
# the music keeps going. Recommendations come from Spotify (for Spotify tracks,
# with Mopidy-Spotify enabled) or from Last.fm (needs lastfm_api_key). With
# neither set up, autoplay does nothing.
autoplay = true
# Your own Last.fm API key, from https://www.last.fm/api/account/create
lastfm_api_key =

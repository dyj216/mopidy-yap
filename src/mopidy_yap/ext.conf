[yap]
enabled = true
votes_to_skip = 3
votes_to_delete = 3
# Number of votes needed to make track played after current one
votes_to_top = 3
pause_button = false
# With Mopidy-Spotify enabled: when the last Spotify track in the queue starts
# playing, add a Spotify recommendation based on it so the music keeps going.
autoplay = true

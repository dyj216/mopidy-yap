[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "Mopidy-Yap"
version = "1.0.0"
description = "Mopidy web extension for party in react"
readme = "README.rst"
requires-python = ">= 3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zsolt Endreffy", email = "ifjezsolt@gmail.com" }]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "httpx >= 0.26",
    "Mopidy >= 3.0",
    "Pykka >= 2.0.1",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/dyj216/mopidy-yap"

[project.entry-points."mopidy.ext"]
yap = "mopidy_yap:Extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mopidy_yap = ["ext.conf", "static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
